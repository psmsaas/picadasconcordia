<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Picadas Concordia</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Versión Compat para integración sencilla con Vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        picadas: {
                            pink: '#d200b3', // Color fucsia del logo
                            pinkDark: '#a10089',
                            dark: '#0f0f11',
                            card: '#1a1a1d'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Oswald', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f0f11;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Scrollbar for tables */
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1a1a1d;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d200b3;
            border-radius: 4px;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in-right {
            animation: slideInRight 0.3s ease-in-out;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Toast Notification */
        #toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 400px;
        }
        .toast {
            background: #1a1a1d;
            border-left: 4px solid #d200b3;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastIn 0.3s ease-out forwards;
        }
        .toast.success { border-left-color: #22c55e; }
        .toast.error { border-left-color: #ef4444; }
        .toast.info { border-left-color: #3b82f6; }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(100%); }
        }

        /* Sticky Columns for Tables */
        .sticky-col-1 {
            position: sticky;
            left: 0;
            background-color: inherit;
            z-index: 10;
        }
        .sticky-col-2 {
            position: sticky;
            left: 40px; /* Adjust based on col 1 width */
            background-color: inherit;
            z-index: 10;
        }
        
        /* Ensure inputs in tables look seamless */
        .table-input {
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            width: 100%;
            text-align: center;
        }
        .table-input:focus {
            border: 1px solid #d200b3;
            outline: none;
            background: rgba(210,0,179,0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-picadas-pink selection:text-white h-screen flex flex-col overflow-hidden">

    <!-- App Container -->
    <div id="app" class="h-full flex flex-col overflow-y-auto"></div>
    
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCvkfQFhGvCii6EGh_2VPwX-uQQBT_2IiE",
            authDomain: "sistemas-picadasconcordia.firebaseapp.com",
            projectId: "sistemas-picadasconcordia",
            storageBucket: "sistemas-picadasconcordia.firebasestorage.app",
            messagingSenderId: "182608457300",
            appId: "1:182608457300:web:c89f0b615a29e856ba47c1"
        };

        // Inicializar Firebase
        let db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            console.log("Firebase inicializado correctamente.");
        } catch (error) {
            console.warn("Error con Firebase:", error);
        }

        // --- DATA & STATE MANAGEMENT ---
        let CLASS_TIME_LIMITS = {
            'Clase 1': 'Tiempo tope: 13.00 seg',
            'Clase 2': 'Tiempo tope: 12.50 seg',
            'Clase 3': 'Tiempo tope: 12.00 seg',
            'Clase 4': 'Tiempo tope: 11.50 seg',
            'Clase 5': 'Tiempo tope: 11.00 seg',
            'Clase 6': 'Tiempo tope: 10.50 seg',
            'Clase 7': 'Tiempo tope: 10.00 seg',
            'Clase 8': 'Tiempo tope: 9.50 seg',
            'Clase 9': 'Tiempo tope: 9.00 seg',
            'Libre Radial': 'Sin límite',
            'Libre': 'Sin límite'
        };

        const APP_STATE = {
            view: 'login', 
            user: null, 
            registeredUsers: [
                { doc: '111', password: 'admin', role: 'admin', name: 'Administrador' } // Admin por defecto
            ],
            selectedCategory: null, 
            selectedClass: null,
            liveTab: 'entrada', 
            prices: {
                ticket: 5000,
                parking: 2000,
                insurance: 15000,
                autoEnrollment: 20000,
                motoEnrollment: 15000,
                reentry: 10000
            },
            liveStatus: {
                active: false,
                category: null,
                class: null
            },
            enrollmentData: {},
            championship: {
                motos: {
                    dates: ['Fecha 1', 'Fecha 2', 'Fecha 3'],
                    classes: ['Clase 1', 'Clase 2', 'Clase 3', 'Clase 4', 'Clase 5', 'Clase 6', 'Clase 7', 'Libre'],
                    data: {
                        'Clase 1': [
                            { id: 1, ins: '01', pilot: 'Juan Pérez', dates: [15, 20, 10] }
                        ]
                    }
                },
                autos: {
                    dates: ['Fecha 1', 'Fecha 2', 'Fecha 3', 'Fecha 4'],
                    classes: ['Clase 1', 'Clase 2', 'Clase 3', 'Clase 4', 'Clase 5', 'Clase 6', 'Clase 7', 'Clase 8', 'Clase 9', 'Libre Radial', 'Libre'],
                    data: {
                        'Clase 4': [
                            { id: 1, ins: '99', pilot: 'A. Senna', dates: [25, 25, 20, 15] }
                        ]
                    }
                }
            }
        };

        // Initialize empty arrays for classes without mock data
        APP_STATE.championship.motos.classes.forEach(cls => {
            if (!APP_STATE.championship.motos.data[cls]) APP_STATE.championship.motos.data[cls] = [];
        });
        APP_STATE.championship.autos.classes.forEach(cls => {
            if (!APP_STATE.championship.autos.data[cls]) APP_STATE.championship.autos.data[cls] = [];
        });

        // --- FIREBASE SYNC ENGINE (TIEMPO REAL) ---
        function initFirebaseSync() {
            if (!db) return;
            
            const docRef = db.collection('picadas').doc('estado_global');
            
            // onSnapshot escucha la base de datos EN TIEMPO REAL
            docRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    
                    // Actualizamos nuestro estado local con lo que viene de la nube
                    if(data.prices) APP_STATE.prices = data.prices;
                    if(data.liveStatus) APP_STATE.liveStatus = data.liveStatus;
                    if(data.championship) APP_STATE.championship = data.championship;
                    if(data.timeLimits) CLASS_TIME_LIMITS = data.timeLimits;
                    if(data.registeredUsers) APP_STATE.registeredUsers = data.registeredUsers;
                    
                    // Re-renderizamos la vista para que el cambio se vea instantáneamente
                    if (APP_STATE.view !== 'login' && APP_STATE.view !== 'register' && APP_STATE.view !== 'recovery' && APP_STATE.view !== 'recoveryStep2') {
                        render(); 
                    }
                } else {
                    // Si el documento no existe en Firebase aún, lo creamos subiendo nuestro estado inicial
                    saveToFirebase();
                }
            });
        }

        function saveToFirebase() {
            if (!db) return;
            
            // Enviamos el estado modificado a Firebase
            db.collection('picadas').doc('estado_global').set({
                prices: APP_STATE.prices,
                liveStatus: APP_STATE.liveStatus,
                championship: APP_STATE.championship,
                timeLimits: CLASS_TIME_LIMITS,
                registeredUsers: APP_STATE.registeredUsers
            }, { merge: true })
            .catch(error => {
                console.error("Error al sincronizar con Firebase:", error);
                showToast("Error de conexión al sincronizar", "error");
            });
        }

        // --- UTILS ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = 'fa-info-circle text-blue-500';
            if (type === 'success') icon = 'fa-check-circle text-green-500';
            if (type === 'error') icon = 'fa-exclamation-circle text-red-500';

            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icon} text-xl"></i>
                <span class="text-white text-sm font-medium">${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function calculateTotalPoints(pilotDates) {
            return pilotDates.reduce((a, b) => (parseInt(a) || 0) + (parseInt(b) || 0), 0);
        }

        function sortClassData(category, className) {
            const data = APP_STATE.championship[category].data[className];
            data.sort((a, b) => calculateTotalPoints(b.dates) - calculateTotalPoints(a.dates));
        }

        // --- CORE ROUTING ---
        function setView(viewName) {
            APP_STATE.view = viewName;
            render();
            document.getElementById('app').scrollTop = 0;
        }

        function render() {
            const app = document.getElementById('app');
            let content = '';

            if (!['login', 'register', 'recovery', 'recoveryStep2'].includes(APP_STATE.view)) {
                content += renderHeader();
            }

            content += '<main class="flex-1 flex flex-col w-full max-w-4xl mx-auto">';
            
            switch (APP_STATE.view) {
                case 'login': content += renderLogin(); break;
                case 'register': content += renderRegister(); break;
                case 'recovery': content += renderRecovery(); break;
                case 'recoveryStep2': content += renderRecoveryStep2(); break;
                case 'dashboard': content += renderDashboard(); break;
                case 'liveEvent': content += renderLiveEvent(); break;
                case 'calendar': content += renderCalendar(); break;
                case 'categories': content += renderCategories(); break;
                case 'classDetail': content += renderClassDetail(); break;
                case 'enrollment': content += renderEnrollment(); break;
                case 'payment': content += renderPayment(); break;
                case 'adminEnrollment': content += renderAdminEnrollment(); break;
                case 'support': content += renderSupport(); break;
                default: content += renderLogin();
            }
            
            content += '</main>';
            app.innerHTML = content;
        }

        // --- VIEWS ---
        function renderHeader() {
            return `
                <header class="bg-picadas-dark border-b border-gray-800 p-4 sticky top-0 z-40 shadow-md">
                    <div class="max-w-4xl mx-auto flex justify-between items-center">
                        <button onclick="handleBack()" class="text-gray-400 hover:text-white p-2">
                            <i class="fas fa-arrow-left text-xl"></i>
                        </button>
                        <div class="flex flex-col items-center cursor-pointer" onclick="setView('dashboard')">
                            <!-- Logo Header -->
                            <img src="logo.png" alt="Picadas Concordia" class="h-8 object-contain">
                        </div>
                        <button onclick="handleLogout()" class="text-gray-400 hover:text-picadas-pink p-2">
                            <i class="fas fa-sign-out-alt text-xl"></i>
                        </button>
                    </div>
                </header>
            `;
        }

        function handleBack() {
            if (APP_STATE.view === 'classDetail') setView('categories');
            else if (APP_STATE.view === 'enrollment') setView('classDetail');
            else if (APP_STATE.view === 'payment') setView('enrollment');
            else if (APP_STATE.view === 'adminEnrollment') setView('classDetail');
            else setView('dashboard');
        }

        function renderLogin() {
            return `
                <div class="flex-1 flex flex-col justify-center p-6 fade-in bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-picadas-pinkDark/20 via-picadas-dark to-black">
                    <div class="w-full max-w-md mx-auto">
                        <div class="text-center mb-10">
                            <!-- Logo Login -->
                            <img src="logo.png" alt="Picadas Concordia" class="h-24 mx-auto mb-4 object-contain drop-shadow-[0_0_15px_rgba(210,0,179,0.3)]">
                            <p class="text-gray-400 font-sans">Sistema de Gestión de Pilotos</p>
                        </div>
                        
                        <form onsubmit="handleLogin(event)" class="space-y-4 bg-picadas-card p-6 rounded-2xl border border-gray-800 shadow-2xl">
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Nro. Documento</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-id-card text-gray-500"></i>
                                    </div>
                                    <input type="number" id="loginDoc" required class="block w-full pl-10 pr-3 py-3 border border-gray-700 rounded-xl bg-black text-white placeholder-gray-500 focus:outline-none focus:border-picadas-pink focus:ring-1 focus:ring-picadas-pink transition-colors" placeholder="12345678">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Contraseña</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-500"></i>
                                    </div>
                                    <input type="password" id="loginPass" required class="block w-full pl-10 pr-3 py-3 border border-gray-700 rounded-xl bg-black text-white placeholder-gray-500 focus:outline-none focus:border-picadas-pink focus:ring-1 focus:ring-picadas-pink transition-colors" placeholder="••••••••">
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-picadas-pink hover:bg-picadas-pinkDark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-picadas-pink transition-colors mt-6 uppercase tracking-wider">
                                Iniciar Sesión
                            </button>
                            
                            <button type="button" onclick="setView('register')" class="w-full py-3 px-4 border border-gray-600 rounded-xl shadow-sm text-sm font-bold text-gray-300 bg-transparent hover:bg-gray-800 focus:outline-none transition-colors mt-2">
                                Registrarse
                            </button>
                        </form>

                        <div class="text-center mt-6">
                            <button onclick="setView('recovery')" class="text-sm text-gray-500 hover:text-picadas-pink transition-colors">¿Olvidaste tu contraseña?</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderRegister() {
            return `
                <div class="flex-1 flex flex-col justify-center p-6 slide-in-right">
                    <div class="w-full max-w-md mx-auto">
                        <button onclick="setView('login')" class="text-gray-400 hover:text-white mb-6 flex items-center gap-2">
                            <i class="fas fa-arrow-left"></i> Volver al Login
                        </button>
                        
                        <h2 class="text-3xl font-display font-bold text-white mb-6 uppercase">Crear Cuenta</h2>
                        
                        <form onsubmit="handleRegister(event)" class="space-y-4 bg-picadas-card p-6 rounded-2xl border border-gray-800">
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Nombre y Apellido</label>
                                <input type="text" id="regName" required class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Nro. Documento</label>
                                <input type="number" id="regDoc" required class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                                <input type="email" id="regEmail" required class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Teléfono</label>
                                <input type="tel" id="regPhone" required class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Contraseña</label>
                                <input type="password" id="regPass" required class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink">
                            </div>

                            <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-picadas-pink hover:bg-picadas-pinkDark transition-colors mt-6 uppercase tracking-wider">
                                Completar Registro
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderRecovery() {
            return `
                <div class="flex-1 flex flex-col justify-center p-6 fade-in">
                    <div class="w-full max-w-md mx-auto">
                        <button onclick="setView('login')" class="text-gray-400 hover:text-white mb-6 flex items-center gap-2">
                            <i class="fas fa-arrow-left"></i> Volver al Login
                        </button>
                        
                        <h2 class="text-3xl font-display font-bold text-white mb-2 uppercase">Recuperar Cuenta</h2>
                        <p class="text-gray-400 mb-6 text-sm">Ingresa tu documento y elige UN método de recuperación (Mail o Teléfono).</p>
                        
                        <form onsubmit="handleRecoveryStep1(event)" class="space-y-4 bg-picadas-card p-6 rounded-2xl border border-gray-800">
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Nro. Documento</label>
                                <input type="number" id="recDoc" required class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink">
                            </div>
                            
                            <div class="relative pt-4 border-t border-gray-800">
                                <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                                <input type="email" id="recEmail" oninput="toggleRecoveryInputs('email')" class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink disabled:bg-gray-900 disabled:opacity-50 transition-all">
                            </div>

                            <div class="text-center text-xs text-gray-600 font-bold uppercase py-1">O</div>

                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Teléfono</label>
                                <input type="tel" id="recPhone" oninput="toggleRecoveryInputs('phone')" class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink disabled:bg-gray-900 disabled:opacity-50 transition-all">
                            </div>

                            <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-white hover:bg-gray-200 text-black transition-colors mt-6 uppercase tracking-wider">
                                Recuperar Usuario
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function toggleRecoveryInputs(active) {
            const emailInput = document.getElementById('recEmail');
            const phoneInput = document.getElementById('recPhone');
            
            if (active === 'email' && emailInput.value.length > 0) {
                phoneInput.disabled = true;
                phoneInput.value = '';
            } else if (active === 'phone' && phoneInput.value.length > 0) {
                emailInput.disabled = true;
                emailInput.value = '';
            } else {
                emailInput.disabled = false;
                phoneInput.disabled = false;
            }
        }

        function renderRecoveryStep2() {
            return `
                <div class="flex-1 flex flex-col justify-center p-6 slide-in-right">
                    <div class="w-full max-w-md mx-auto">
                        <h2 class="text-3xl font-display font-bold text-white mb-2 uppercase">Nueva Contraseña</h2>
                        <p class="text-gray-400 mb-6 text-sm" id="recoveryMessage">Ingresa el código que te enviamos y tu nueva contraseña.</p>
                        
                        <form onsubmit="handleRecoveryStep2(event)" class="space-y-4 bg-picadas-card p-6 rounded-2xl border border-gray-800">
                            <div id="codeContainer">
                                <label class="block text-sm font-medium text-gray-400 mb-1">Código de verificación</label>
                                <input type="text" id="recCode" class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink text-center tracking-widest font-bold" placeholder="000000">
                            </div>
                            
                            <div class="pt-2">
                                <label class="block text-sm font-medium text-gray-400 mb-1">Nueva Contraseña</label>
                                <input type="password" id="recNewPass" required class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1">Repetir Contraseña</label>
                                <input type="password" id="recNewPassConfirm" required class="block w-full px-4 py-3 border border-gray-700 rounded-xl bg-black text-white focus:outline-none focus:border-picadas-pink">
                            </div>

                            <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-picadas-pink hover:bg-picadas-pinkDark transition-colors mt-6 uppercase tracking-wider">
                                Cambiar e Iniciar Sesión
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            let adminPanel = '';
            if (APP_STATE.user.role === 'admin') {
                adminPanel = `
                    <button onclick="setView('liveEvent')" class="group relative overflow-hidden bg-picadas-pinkDark border border-picadas-pink p-6 rounded-2xl hover:bg-picadas-pink transition-colors text-left flex flex-col justify-end min-h-[120px] md:col-span-2 shadow-[0_0_20px_rgba(210,0,179,0.4)] animate-pulse hover:animate-none mb-4">

                return `
                <button onclick="APP_STATE.selectedClass='${cls}'; setView('classDetail');" class="relative bg-picadas-card border ${isThisClassLive ? 'border-green-500 shadow-[0_0_10px_rgba(34,197,94,0.2)]' : 'border-gray-800 hover:border-picadas-pink'} rounded-xl p-4 flex flex-col items-center justify-center gap-2 transition-all hover:bg-gray-900 group">

        function renderClassDetail() {
            const cat = APP_STATE.selectedCategory;
            const cls = APP_STATE.selectedClass;
            const categoryData = APP_STATE.championship[cat];
            
            sortClassData(cat, cls);
            const data = categoryData.data[cls] || [];
            
            const isAdmin = APP_STATE.user.role === 'admin';
            
            let timeLimitContent = '';
            if (isAdmin) {
                timeLimitContent = `<input type="text" value="${CLASS_TIME_LIMITS[cls] || ''}" onchange="saveClassTime('${cls}', this.value)" class="bg-transparent border-b border-dashed border-gray-600 text-gray-400 text-sm focus:outline-none focus:border-picadas-pink focus:text-white px-1 w-48" placeholder="Ej: Tiempo tope: 12.00 seg">`;
            } else {
                timeLimitContent = `<span class="text-gray-400 text-sm">${CLASS_TIME_LIMITS[cls] || 'Tiempo no definido'}</span>`;
            }

            let headers = `
                <th class="sticky-col-1 bg-picadas-card px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider w-12">Pos</th>
                <th class="bg-picadas-card px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider w-16">N°</th>

            `;
            categoryData.dates.forEach((date, i) => {
                headers += `<th class="bg-picadas-card px-2 py-3 text-center text-xs font-bold text-gray-400 uppercase tracking-wider min-w-[80px]">${date}</th>`;
            });
            headers += `<th class="bg-picadas-card px-4 py-3 text-center text-xs font-bold text-picadas-pink uppercase tracking-wider min-w-[80px]">Total</th>`;

            let rows = '';
            if (data.length === 0) {
                rows = `<tr><td colspan="${categoryData.dates.length + 4}" class="px-4 py-8 text-center text-gray-500">No hay pilotos inscriptos en esta clase.</td></tr>`;
            } else {
                data.forEach((row, index) => {
                    const total = calculateTotalPoints(row.dates);
                    let positionClass = "text-gray-400";
                    if (index === 0) positionClass = "text-yellow-500 font-bold text-lg"; 
                    else if (index === 1) positionClass = "text-gray-300 font-bold text-lg"; 
                    else if (index === 2) positionClass = "text-orange-600 font-bold text-lg"; 

                    let rowHtml = `
                        <tr class="border-b border-gray-800 hover:bg-gray-900/50 transition-colors">
                            <td class="sticky-col-1 bg-[#151518] px-3 py-3 whitespace-nowrap text-center ${positionClass}">${index + 1}</td>
                            <td class="px-3 py-3 whitespace-nowrap text-gray-300 font-mono">${row.ins}</td>
                            <td class="sticky-col-2 bg-[#151518] px-4 py-3 whitespace-nowrap font-bold text-white border-r border-gray-800">${row.pilot}</td>
                    `;
                    
                    categoryData.dates.forEach((date, dateIndex) => {
                        const val = row.dates[dateIndex] || '';
                        if (isAdmin) {
                            rowHtml += `<td class="px-2 py-3 whitespace-nowrap"><input type="number" class="table-input" value="${val}" onchange="updatePilotScore('${cat}', '${cls}', ${row.id}, ${dateIndex}, this.value)"></td>`;
                        } else {
                            rowHtml += `<td class="px-2 py-3 whitespace-nowrap text-center text-gray-400">${val || '-'}</td>`;
                        }
                    });

                    rowHtml += `<td class="px-4 py-3 whitespace-nowrap text-center font-bold text-picadas-pink">${total}</td></tr>`;
                    rows += rowHtml;
                });
            }

            let adminControls = '';
            let userControls = '';
            
            if (isAdmin) {
                adminControls = `
                    <div class="flex flex-wrap gap-2 mb-4 bg-gray-900 p-3 rounded-xl border border-gray-800">
                        <button onclick="addChampionshipDate('${cat}')" class="text-xs bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded flex items-center gap-1 border border-gray-700"><i class="fas fa-plus"></i> Añadir Fecha</button>
                        <button onclick="setView('adminEnrollment')" class="text-xs bg-picadas-pink hover:bg-picadas-pinkDark text-white px-3 py-2 rounded flex items-center gap-1"><i class="fas fa-user-plus"></i> Inscribir Piloto</button>

                    </div>
                `;
            } else {
                const isThisLive = APP_STATE.liveStatus.active && APP_STATE.liveStatus.category === cat && APP_STATE.liveStatus.class === cls;
                
                userControls = `
                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black via-black to-transparent z-20 pb-8">
                        <div class="max-w-4xl mx-auto flex gap-3">
                            <button onclick="setView('enrollment')" class="flex-1 bg-picadas-pink hover:bg-picadas-pinkDark text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(210,0,179,0.3)] transition-colors uppercase tracking-wider flex justify-center items-center gap-2">
                                <i class="fas fa-flag-checkered"></i> INSCRIBIRME
                            </button>
                            ${isThisLive ? `<div class="bg-green-500 text-white font-bold px-4 rounded-xl flex items-center justify-center animate-pulse"><i class="fas fa-broadcast-tower mr-2"></i> EN PISTA</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex-1 flex flex-col h-full fade-in relative ${!isAdmin ? 'pb-24' : 'pb-6'}">
                    <div class="p-4 border-b border-gray-800 shrink-0">
                        <div class="flex items-center gap-3 mb-1">
                            <h2 class="text-2xl font-display font-bold text-white uppercase">${cls} <span class="text-gray-500 text-lg">/ ${cat}</span></h2>
                        </div>
                        ${timeLimitContent}
                    </div>
                    
                    <div class="p-4 shrink-0">
                        ${adminControls}
                    </div>

                    <div class="flex-1 overflow-hidden px-4">
                        <div class="h-full overflow-auto custom-scrollbar bg-[#151518] rounded-xl border border-gray-800 shadow-inner">
                            <table class="min-w-full border-collapse">
                                <thead class="sticky top-0 z-20">
                                    <tr>${headers}</tr>
                                </thead>
                                <tbody class="bg-[#151518] divide-y divide-gray-800">
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    ${userControls}
                </div>
            `;
        }

        // --- HANDLERS ---
        function handleLogin(e) {
            e.preventDefault();
            const doc = document.getElementById('loginDoc').value;
            const pass = document.getElementById('loginPass').value;

            const user = APP_STATE.registeredUsers.find(u => u.doc === doc && u.password === pass);

            if (user) {
                APP_STATE.user = user;
                localStorage.setItem('picadas_user', JSON.stringify(user)); // Guarda sesión temporal local
                setView('dashboard');
            } else {
                showToast('Documento o contraseña incorrectos', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const doc = document.getElementById('regDoc').value;
            
            if (APP_STATE.registeredUsers.find(u => u.doc === doc)) {
                showToast('Usuario ya registrado', 'error');
                return;
            }

            const newUser = {
                doc: doc,
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                password: document.getElementById('regPass').value,
                role: 'user'
            };

            APP_STATE.registeredUsers.push(newUser);
            saveToFirebase(); // Sincroniza nuevo usuario
            
            showToast('¡Registro correcto! Inicia sesión', 'success');
            setView('login');
        }

        function handleRecoveryStep1(e) {
            e.preventDefault();
            const doc = document.getElementById('recDoc').value;
            const email = document.getElementById('recEmail').value;
            const phone = document.getElementById('recPhone').value;

            const user = APP_STATE.registeredUsers.find(u => u.doc === doc);
            if (!user) {
                showToast('Documento no encontrado', 'error');
                return;
            }

            if (email) {
                showToast('Link enviado al mail. (Simulado: redirigiendo...)', 'info');
                setTimeout(() => {
                    document.getElementById('recoveryMessage').innerText = "Ingresa tu nueva contraseña.";
                    document.getElementById('codeContainer').style.display = 'none';
                    setView('recoveryStep2');
                }, 1500);
            } else if (phone) {
                showToast('Código SMS enviado. (Simulado: ingresa cualquiera)', 'info');
                setView('recoveryStep2');
            }
        }

        function handleRecoveryStep2(e) {
            e.preventDefault();
            const pass1 = document.getElementById('recNewPass').value;
            const pass2 = document.getElementById('recNewPassConfirm').value;

            if (pass1 !== pass2) {
                showToast('Las contraseñas no coinciden', 'error');
                return;
            }

            // Aquí en la versión completa buscaríamos el usuario y cambiaríamos el pass. 
            // Como simulamos la recuperación, volvemos al login:
            showToast('Contraseña cambiada. Inicie sesión', 'success');
            setView('login');
        }

        function handleLogout() {
            APP_STATE.user = null;
            APP_STATE.selectedCategory = null;
            APP_STATE.selectedClass = null;
            localStorage.removeItem('picadas_user'); // Borra sesión local
            setView('login');
        }

        function handleEnrollmentStep1(e) {
            e.preventDefault();
            APP_STATE.enrollmentData = {
                address: document.getElementById('enrollAddress').value,
                blood: document.getElementById('enrollBlood').value
            };
            setView('payment');
        }

        function handleSupportSubmit(e, type) {
            e.preventDefault();
            showToast(`Mensaje de ${type} enviado correctamente.`, 'success');
            e.target.reset();
        }

        function copyCBU() {
            const tempInput = document.createElement("input");
            tempInput.value = "0000003100012345678901";
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast('CBU copiado al portapapeles', 'success');
        }

        function finishUserEnrollment() {
            const cat = APP_STATE.selectedCategory;
            const cls = APP_STATE.selectedClass;
            
            const newPilot = {
                id: Date.now(),
                ins: 'Pte',
                pilot: APP_STATE.user.name,
                dates: new Array(APP_STATE.championship[cat].dates.length).fill('')
            };
            
            APP_STATE.championship[cat].data[cls].push(newPilot);
            saveToFirebase(); // Sincroniza nueva inscripción
            
            showToast('¡Inscripción pendiente de confirmación en torre!', 'success');
            setView('classDetail');
        }

        function handleAdminEnrollmentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('adminEnrollName').value;
            const number = document.getElementById('adminEnrollNumber').value;
            const payment = document.getElementById('adminEnrollPayment').value;
            
            const cat = APP_STATE.selectedCategory;
            const cls = APP_STATE.selectedClass;

            const newPilot = {
                id: Date.now(),
                ins: number,
                pilot: name,
                dates: new Array(APP_STATE.championship[cat].dates.length).fill('')
            };
            
            APP_STATE.championship[cat].data[cls].push(newPilot);
            saveToFirebase(); // Sincroniza nueva inscripción administrativa
            
            showToast(`Piloto inscripto correctamente. Pago vía: ${payment}`, 'success');
            setView('classDetail');
        }

        function saveClassTime(cls, val) {
            CLASS_TIME_LIMITS[cls] = val;
            saveToFirebase(); // Sincroniza tiempos
            showToast('Tiempo actualizado', 'success');
        }

        function updatePilotScore(category, className, pilotId, dateIndex, value) {
            const data = APP_STATE.championship[category].data[className];
            const pilot = data.find(p => p.id === pilotId);
            if (pilot) {
                pilot.dates[dateIndex] = value === '' ? '' : parseInt(value) || 0;
                saveToFirebase(); // Sincroniza puntaje editado
            }
        }

        function addChampionshipDate(category) {
            const count = APP_STATE.championship[category].dates.length + 1;
            APP_STATE.championship[category].dates.push(`Fecha ${count}`);
            
            Object.values(APP_STATE.championship[category].data).forEach(classData => {
                classData.forEach(pilot => pilot.dates.push(''));
            });
            
            saveToFirebase(); // Sincroniza nueva fecha global
            showToast(`Fecha ${count} añadida`, 'success');
        }

        function resetChampionshipYear(category) {
            if(confirm("ATENCIÓN: Esto borrará todos los puntos y dejará solo 1 fecha inicial. Los pilotos se mantendrán. ¿Estás seguro?")) {
                APP_STATE.championship[category].dates = ['Fecha 1'];
                Object.values(APP_STATE.championship[category].data).forEach(classData => {
                    classData.forEach(pilot => {
                        pilot.dates = [''];
                    });
                });
                
                saveToFirebase(); // Sincroniza reinicio
                showToast('Año reiniciado correctamente', 'info');
            }
        }

        function calculateGateTotal() {
            const isRacer = document.getElementById('gateIsRacer').checked;
            let total = 0;
            
            if (isRacer) {
                total = APP_STATE.prices.insurance;
            } else {
                const qty = parseInt(document.getElementById('gateQty').value) || 1;
                const parking = document.getElementById('gateParking').checked ? APP_STATE.prices.parking : 0;
                total = (qty * APP_STATE.prices.ticket) + parking;
            }
            
            document.getElementById('gateTotal').innerText = `$${total}`;
        }

        function toggleGateRacerMode() {
            const isRacer = document.getElementById('gateIsRacer').checked;
            const espSection = document.getElementById('espectadorSection');
            const racerSection = document.getElementById('racerSection');
            
            if(isRacer) {
                espSection.classList.add('hidden');
                racerSection.classList.remove('hidden');
            } else {
                espSection.classList.remove('hidden');
                racerSection.classList.add('hidden');
            }
            calculateGateTotal();
        }

        function processGatePayment() {
            const isRacer = document.getElementById('gateIsRacer').checked;
            const total = document.getElementById('gateTotal').innerText;
            const method = document.getElementById('gatePayment').value;
            
            const type = isRacer ? 'Piloto (Seguro)' : 'Espectador';
            showToast(`Cobro exitoso: ${type} - ${total} en ${method}`, 'success');
            
            document.getElementById('gateQty').value = 1;
            document.getElementById('gateParking').checked = false;
            document.getElementById('gateIsRacer').checked = false;
            toggleGateRacerMode();
        }

        function updateTorreTotal() {
            const type = document.getElementById('torreType').value;
            const mode = document.querySelector('input[name="torreMode"]:checked').value;
            
            let total = 0;
            if (mode === 'reenganche') {
                total = APP_STATE.prices.reentry;
            } else {
                total = type === 'auto' ? APP_STATE.prices.autoEnrollment : APP_STATE.prices.motoEnrollment;
            }
            
            document.getElementById('torreTotal').innerText = `$${total}`;
        }

        function processTorrePayment() {
            const total = document.getElementById('torreTotal').innerText;
            const method = document.getElementById('torrePayment').value;
            showToast(`Inscripción registrada en torre: ${total} en ${method}`, 'success');
        }

        function saveLivePrices(e) {
            e.preventDefault();
            APP_STATE.prices.ticket = parseInt(document.getElementById('valTicket').value);
            APP_STATE.prices.parking = parseInt(document.getElementById('valParking').value);
            APP_STATE.prices.insurance = parseInt(document.getElementById('valInsurance').value);
            APP_STATE.prices.autoEnrollment = parseInt(document.getElementById('valAuto').value);
            APP_STATE.prices.motoEnrollment = parseInt(document.getElementById('valMoto').value);
            APP_STATE.prices.reentry = parseInt(document.getElementById('valReentry').value);
            
            saveToFirebase(); // GATILLA LA SINCRONIZACIÓN EN TIEMPO REAL A TODOS
            showToast('Valores sincronizados en Firebase.', 'success');
        }

        function startLiveEvent(category, cls) {
            APP_STATE.liveStatus = {
                active: true,
                category: category,
                class: cls
            };
            saveToFirebase(); // Gatilla sync global del evento
            showToast(`¡Transmisión iniciada para ${cls}!`, 'success');
        }

        function stopLiveEvent() {
            APP_STATE.liveStatus.active = false;
            saveToFirebase(); // Gatilla apagado global del evento
            showToast('Evento en vivo detenido.', 'info');
        }

        // --- INIT APP ---
        function initApp() {
            // Inicializar el escuchador de la nube
            if (db) {
                initFirebaseSync();
            }

            // Chequear si ya habíamos iniciado sesión localmente en este navegador
            const savedUser = localStorage.getItem('picadas_user');
            if (savedUser) {
                APP_STATE.user = JSON.parse(savedUser);
                setView('dashboard');
            } else {
                setView('login');
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
