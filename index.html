        }

            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in-right { animation: slideInRight 0.3s ease-in-out; }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Toast Notification */
        #toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            width: 90%;

        }

            background: #1a1a1d;

            padding: 12px 16px;
            border-radius: 8px;

            align-items: center;

        @keyframes toastIn {

            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }

</head>

            try {

        function loadFromFirebase() {
            try {
                const data = localStorage.getItem('picadasData');

                    const parsed = JSON.parse(data);
                    APP_STATE.championship = parsed.championship || APP_STATE.championship;
                    APP_STATE.liveStatus = parsed.liveStatus || APP_STATE.liveStatus;
                    APP_STATE.prices = parsed.prices || APP_STATE.prices;
                    APP_STATE.balance = parsed.balance || APP_STATE.balance;
                    
                    if(parsed.history) APP_STATE.history = parsed.history;
                    if(!APP_STATE.history.balances) APP_STATE.history.balances = [];
                    if(!APP_STATE.history.classes) APP_STATE.history.classes = [];
                    
                    APP_STATE.calendar = parsed.calendar || [];
                    APP_STATE.notifications = parsed.notifications || [];

        // --- UTILS ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = 'fa-info-circle text-blue-500';
            if (type === 'success') icon = 'fa-check-circle text-green-500';
            if (type === 'error') icon = 'fa-exclamation-circle text-red-500';

            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${icon} text-xl"></i><span class="text-white text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function calculateTotalPoints(pilotDates) {
            return pilotDates.reduce((a, b) => (parseInt(a) || 0) + (parseInt(b) || 0), 0);
        }

        function sortClassData(category, className) {
            const data = APP_STATE.championship[category].data[className];
            data.sort((a, b) => calculateTotalPoints(b.dates) - calculateTotalPoints(a.dates));
        }

        function setView(viewName) {
            if(dashboardInterval) clearInterval(dashboardInterval);
            
            APP_STATE.view = viewName;
            render();
            document.getElementById('app').scrollTop = 0;
        }

        // --- SISTEMA DE REGLAS DE INSCRIPCIÓN ---
        function getEnrollmentStatus(cat, cls) {
            const now = new Date();
            let nextEvent = null;
            let minDiff = Infinity;
            
            // 1. Buscar si hay una fecha próxima no finalizada
            if (APP_STATE.calendar) {
                APP_STATE.calendar.forEach(ev => {
                    if (ev.rawDate && !ev.finished) {
                        const evDate = new Date(ev.rawDate + 'T00:00:00');
                        const diff = evDate - now;
                        if (diff > -86400000 && diff < minDiff) { 
                            minDiff = diff;
                            nextEvent = ev;
                        }
                    }
                });
            }

            if (!nextEvent) {
                return { open: false, reason: 'SIN FECHA CONFIRMADA' };
            }

            // 2. Control ventana de 5 días (5 * 24 * 60 * 60 * 1000 ms = 432000000 ms)
            if (minDiff > 432000000) {
                return { open: false, reason: 'ABRE 5 DÍAS ANTES' };
            }

            // 3. Control de clase iniciada por admin (Live Event)
            if (APP_STATE.liveStatus.active && APP_STATE.liveStatus.category === cat && APP_STATE.liveStatus.class === cls) {
                return { open: false, reason: 'EN PISTA - CERRADA' };
            }

            // 4. Control si la clase ya finalizó hoy
            const currentChampionshipDate = APP_STATE.championship[cat].dates[APP_STATE.championship[cat].dates.length - 1];
            const alreadyFinished = APP_STATE.history.classes.some(c => 
                c.category === cat && 
                c.className === cls && 
                c.championshipDate === currentChampionshipDate
            );

            if (alreadyFinished) {
                return { open: false, reason: 'CLASE FINALIZADA' };
            }

            return { open: true };
        }

        // --- RENDERIZADO PRINCIPAL ---
        function render() {
            const app = document.getElementById('app');
            let content = '';

            if (!['login', 'register', 'recovery', 'recoveryStep2'].includes(APP_STATE.view)) {
                content += renderHeader();
            }

            content += '<main class="flex-1 flex flex-col w-full max-w-4xl mx-auto">';
            
            switch (APP_STATE.view) {
                case 'login': content += renderLogin(); break;
                case 'register': content += renderRegister(); break;
                case 'recovery': content += renderRecovery(); break;
                case 'recoveryStep2': content += renderRecoveryStep2(); break;
                case 'dashboard': content += renderDashboard(); break;
                case 'liveEvent': content += renderLiveEvent(); break;
                case 'calendar': content += renderCalendar(); break;
                case 'categories': content += renderCategories(); break;
                case 'classDetail': content += renderClassDetail(); break;
                case 'enrollment': content += renderEnrollment(); break;
                case 'payment': content += renderPayment(); break;
                case 'adminEnrollment': content += renderAdminEnrollment(); break;
                case 'support': content += renderSupport(); break;
                case 'notifications': content += renderNotifications(); break;
                case 'userNotifications': content += renderUserNotifications(); break;
                default: content += renderLogin();
            }
            
            content += '</main>';
            app.innerHTML = content;

            // Consultar clima solo si estamos en el calendario
            if (APP_STATE.view === 'calendar') {
                APP_STATE.calendar.forEach(ev => {
                    fetchWeatherForConcordia(ev, `weather-${ev.id}`);
                });
            }
        }

        function toggleRecoveryInputs(active) {
            const emailInput = document.getElementById('recEmail');
            const phoneInput = document.getElementById('recPhone');
            
            if (active === 'email' && emailInput.value.length > 0) {
                phoneInput.disabled = true;
                phoneInput.value = '';
            } else if (active === 'phone' && phoneInput.value.length > 0) {

        function startDashboardCountdown(targetDate) {
            if(dashboardInterval) clearInterval(dashboardInterval);
            
            const update = () => {
                const el = document.getElementById('countdown-timer-boxes');
                if(!el) return;
                
                const now = new Date();
                const diff = targetDate - now;
                
                if(diff <= 0) {
                    el.innerHTML = '<div class="text-green-500 font-bold text-2xl uppercase animate-pulse w-full text-center py-4 tracking-widest"><i class="fas fa-flag-checkered mr-2"></i> ¡EL EVENTO ES HOY!</div>';
                    clearInterval(dashboardInterval);
                    return;
                }
                
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                const s = Math.floor((diff / 1000) % 60);

                const renderBox = (num, label) => `
                    <div class="flex flex-col items-center">
                        <div class="bg-black/50 border border-gray-700 w-12 h-12 md:w-16 md:h-16 rounded-xl flex items-center justify-center mb-1.5 shadow-inner backdrop-blur-sm">
                            <span class="font-display font-bold text-xl md:text-3xl text-white">${num < 10 ? '0'+num : num}</span>
                        </div>
                        <span class="text-[9px] md:text-[10px] text-gray-400 uppercase font-bold tracking-widest">${label}</span>
                    </div>
                `;
                
                el.innerHTML = renderBox(d, 'Días') + renderBox(h, 'Horas') + renderBox(m, 'Min') + renderBox(s, 'Seg');
            };
            
            update(); 
            dashboardInterval = setInterval(update, 1000);
        }

        function renderClassDetail() {
            const cat = APP_STATE.selectedCategory;
            const cls = APP_STATE.selectedClass;
            const categoryData = APP_STATE.championship[cat];
            const classTimeLimits = CLASS_TIME_LIMITS[cat] || {};
            
            sortClassData(cat, cls);
            const data = categoryData.data[cls] || [];
            
            const isAdmin = APP_STATE.user.role === 'admin';
            
            let timeLimitContent = '';
            if (isAdmin) {
                timeLimitContent = `<input type="text" value="${classTimeLimits[cls] || ''}" onchange="saveClassTime('${cat}', '${cls}', this.value)" class="bg-transparent border-b border-dashed border-gray-600 text-gray-400 text-sm focus:outline-none focus:border-picadas-pink focus:text-white px-1 w-48" placeholder="Ej: Tiempo tope: 12.00 seg">`;
            } else {
                timeLimitContent = `<span class="text-gray-400 text-sm">${classTimeLimits[cls] || 'Tiempo no definido'}</span>`;
            }

            let headers = `
                <th class="sticky-col-1 bg-picadas-card px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider w-12">Pos</th>
                <th class="bg-picadas-card px-3 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider w-16">N°</th>
                <th class="sticky-col-2 bg-picadas-card px-4 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider min-w-[150px] border-r border-gray-800">Piloto</th>
            `;
            categoryData.dates.forEach((date) => {
                headers += `<th class="bg-picadas-card px-2 py-3 text-center text-xs font-bold text-gray-400 uppercase tracking-wider min-w-[80px]">${date}</th>`;
            });
            headers += `<th class="bg-picadas-card px-4 py-3 text-center text-xs font-bold text-picadas-pink uppercase tracking-wider min-w-[80px]">Total</th>`;

            let rows = '';
            if (data.length === 0) {
                rows = `<tr><td colspan="${categoryData.dates.length + 4}" class="px-4 py-8 text-center text-gray-500">No hay pilotos inscriptos en esta clase.</td></tr>`;
            } else {
                data.forEach((row, index) => {
                    const total = calculateTotalPoints(row.dates);
                    let positionClass = "text-gray-400";
                    if (index === 0) positionClass = "text-yellow-500 font-bold text-lg"; 
                    else if (index === 1) positionClass = "text-gray-300 font-bold text-lg"; 
                    else if (index === 2) positionClass = "text-orange-600 font-bold text-lg"; 

                    let rowHtml = `
                        <tr class="border-b border-gray-800 hover:bg-gray-900/50 transition-colors">
                            <td class="sticky-col-1 bg-[#151518] px-3 py-3 whitespace-nowrap text-center ${positionClass}">${index + 1}</td>
                            <td class="px-3 py-3 whitespace-nowrap text-gray-300 font-mono">${row.ins}</td>
                            <td class="sticky-col-2 bg-[#151518] px-4 py-3 whitespace-nowrap font-bold text-white border-r border-gray-800">${row.pilot}</td>
                    `;
                    
                    categoryData.dates.forEach((date, dateIndex) => {
                        const val = row.dates[dateIndex] || '';
                        if (isAdmin) {
                            rowHtml += `<td class="px-2 py-3 whitespace-nowrap"><input type="number" class="table-input" value="${val}" onchange="updatePilotScore('${cat}', '${cls}', ${row.id}, ${dateIndex}, this.value)"></td>`;
                        } else {
                            rowHtml += `<td class="px-2 py-3 whitespace-nowrap text-center text-gray-400">${val || '-'}</td>`;
                        }
                    });

                    rowHtml += `<td class="px-4 py-3 whitespace-nowrap text-center font-bold text-picadas-pink">${total}</td></tr>`;
                    rows += rowHtml;
                });
            }

            let adminControls = '';
            let userControls = '';
            
            if (isAdmin) {
                adminControls = `
                    <div class="flex flex-wrap gap-2 mb-4 bg-gray-900 p-3 rounded-xl border border-gray-800">
                        <button onclick="addChampionshipDate('${cat}')" class="text-xs bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded flex items-center gap-1 border border-gray-700"><i class="fas fa-plus"></i> Añadir Fecha</button>
                        <button onclick="setView('adminEnrollment')" class="text-xs bg-picadas-pink hover:bg-picadas-pinkDark text-white px-3 py-2 rounded flex items-center gap-1"><i class="fas fa-user-plus"></i> Inscribir Piloto</button>
                        <button onclick="resetChampionshipYear('${cat}')" class="text-xs bg-red-900 hover:bg-red-800 text-white px-3 py-2 rounded flex items-center gap-1 ml-auto border border-red-700"><i class="fas fa-undo"></i> Reiniciar Año</button>
                    </div>
                `;
            } else {
                const enrollmentStatus = getEnrollmentStatus(cat, cls);
                const isThisLive = APP_STATE.liveStatus.active && APP_STATE.liveStatus.category === cat && APP_STATE.liveStatus.class === cls;
                
                let enrollBtnHtml = '';
                if (enrollmentStatus.open) {
                    enrollBtnHtml = `
                        <button onclick="setView('enrollment')" class="flex-1 bg-picadas-pink hover:bg-picadas-pinkDark text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(210,0,179,0.3)] transition-colors uppercase tracking-wider flex justify-center items-center gap-2">
                            <i class="fas fa-flag-checkered"></i> INSCRIBIRME
                        </button>
                    `;
                } else {
                    enrollBtnHtml = `
                        <div class="flex-1 bg-gray-900 border border-gray-800 text-gray-500 font-bold py-4 rounded-xl shadow-inner flex justify-center items-center gap-2 cursor-not-allowed uppercase tracking-wider text-xs md:text-sm">
                            <i class="fas fa-lock"></i> ${enrollmentStatus.reason}
                        </div>
                    `;
                }

                userControls = `
                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black via-black to-transparent z-20 pb-8 pointer-events-none">
                        <div class="max-w-4xl mx-auto flex gap-3 pointer-events-auto">
                            ${enrollBtnHtml}
                            ${isThisLive ? `<div class="bg-green-500 text-white font-bold px-4 rounded-xl flex items-center justify-center animate-pulse shadow-[0_0_15px_rgba(34,197,94,0.3)]"><i class="fas fa-broadcast-tower mr-2"></i> EN PISTA</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex-1 flex flex-col h-full fade-in relative ${!isAdmin ? 'pb-24' : 'pb-6'}">
                    <div class="p-4 border-b border-gray-800 shrink-0">
                        <div class="flex items-center gap-3 mb-1">
                            <h2 class="text-2xl font-display font-bold text-white uppercase">${cls} <span class="text-gray-500 text-lg">/ ${cat}</span></h2>
                        </div>
                        ${timeLimitContent}
                    </div>
                    
                    <div class="p-4 shrink-0">
                        ${adminControls}
                    </div>

                    <div class="flex-1 overflow-hidden px-4">
                        <div class="h-full overflow-auto custom-scrollbar bg-[#151518] rounded-xl border border-gray-800 shadow-inner">
                            <table class="min-w-full border-collapse">
                                <thead class="sticky top-0 z-20">
                                    <tr>${headers}</tr>
                                </thead>
                                <tbody class="bg-[#151518] divide-y divide-gray-800">
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    ${userControls}
                </div>
            `;
        }

        // --- HANDLERS ---
        function handleLogin(e) {
            e.preventDefault();
            const doc = document.getElementById('loginDoc').value;
            const pass = document.getElementById('loginPass').value;

            const user = APP_STATE.registeredUsers.find(u => u.doc === doc && u.password === pass);

            if (user) {
                APP_STATE.user = user;
                localStorage.setItem('picadasSession', JSON.stringify(user));
                setView('dashboard');
            } else {
                showToast('Documento o contraseña incorrectos', 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const doc = document.getElementById('regDoc').value;
            
            if (APP_STATE.registeredUsers.find(u => u.doc === doc)) {
                showToast('Usuario ya registrado', 'error');
                return;
            }

            const newUser = {
                doc: doc,
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                password: document.getElementById('regPass').value,
                role: 'user'
            };

            APP_STATE.registeredUsers.push(newUser);
            saveToFirebase();
            showToast('¡Registro correcto! Inicia sesión', 'success');
            setView('login');
        }

        function handleRecoveryStep1(e) {
            e.preventDefault();
            const doc = document.getElementById('recDoc').value;
            const email = document.getElementById('recEmail').value;
            const phone = document.getElementById('recPhone').value;

            const user = APP_STATE.registeredUsers.find(u => u.doc === doc);
            if (!user) {
                showToast('Documento no encontrado', 'error');
                return;
            }

            if (email) {
                showToast('Link enviado al mail. (Simulado)', 'info');
                setTimeout(() => {
                    document.getElementById('recoveryMessage').innerText = "Ingresa tu nueva contraseña.";
                    document.getElementById('codeContainer').style.display = 'none';
                    setView('recoveryStep2');
                }, 1500);
            } else if (phone) {
                showToast('Código SMS enviado. (Simulado)', 'info');
                setView('recoveryStep2');
            }
        }

        function handleRecoveryStep2(e) {
            e.preventDefault();
            const pass1 = document.getElementById('recNewPass').value;
            const pass2 = document.getElementById('recNewPassConfirm').value;

            if (pass1 !== pass2) {
                showToast('Las contraseñas no coinciden', 'error');
                return;
            }

            showToast('Contraseña cambiada. Inicie sesión', 'success');
            setView('login');
        }

        function handleLogout() {
            APP_STATE.user = null;
            APP_STATE.selectedCategory = null;
            APP_STATE.selectedClass = null;
            localStorage.removeItem('picadasSession');
            setView('login');
        }

        function handleEnrollmentStep1(e) {
            e.preventDefault();
            APP_STATE.enrollmentData = {
                address: document.getElementById('enrollAddress').value,
                blood: document.getElementById('enrollBlood').value
            };
            setView('payment');
        }

        function handleSupportSubmit(e, type) {
            e.preventDefault();
            const textarea = document.getElementById(`supportText-${type}`);
            const message = textarea.value;

            if(!APP_STATE.notifications) APP_STATE.notifications = [];
            
            APP_STATE.notifications.unshift({
                id: Date.now(),
                date: new Date().toLocaleString([], {hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'2-digit'}),
                user: APP_STATE.user ? APP_STATE.user.name : 'Usuario',
                doc: APP_STATE.user ? APP_STATE.user.doc : 'N/A',
                type: type, 
                message: message,
                read: false
            });

            saveToFirebase();
            showToast(`Mensaje enviado al administrador correctamente.`, 'success');
            textarea.value = '';
        }

        function copyCBU() {
            const tempInput = document.createElement("input");
            tempInput.value = "0000003100012345678901";
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast('CBU copiado al portapapeles', 'success');
        }

        function finishUserEnrollment() {
            const cat = APP_STATE.selectedCategory;
            const cls = APP_STATE.selectedClass;
            
            const newPilot = {
                id: Date.now(),
                ins: 'Pte',
                pilot: APP_STATE.user.name,
                dates: new Array(APP_STATE.championship[cat].dates.length).fill('')
            };
            
            APP_STATE.championship[cat].data[cls].push(newPilot);
            
            showToast(`Piloto inscripto correctamente.`, 'success');
            setView('classDetail');
        }

        function handleAdminEnrollmentSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('adminEnrollName').value;
            const number = document.getElementById('adminEnrollNumber').value;
            const payment = document.getElementById('adminEnrollPayment').value;
            
            const cat = APP_STATE.selectedCategory;
            const cls = APP_STATE.selectedClass;

            const newPilot = {
                id: Date.now(),
                ins: number,
                pilot: name,
                dates: new Array(APP_STATE.championship[cat].dates.length).fill('')
            };
            
            APP_STATE.championship[cat].data[cls].push(newPilot);
            
            let amount = cat === 'autos' ? APP_STATE.prices.autoEnrollment : APP_STATE.prices.motoEnrollment;
            if (cat === 'autos') APP_STATE.balance.autoEnrollment += amount;
            if (cat === 'motos') APP_STATE.balance.motoEnrollment += amount;

            saveToFirebase();
            showToast(`Piloto inscripto correctamente. Pago vía: ${payment}`, 'success');
            setView('classDetail');
        }

        function saveClassTime(cat, cls, val) {
            if (!CLASS_TIME_LIMITS[cat]) {
                CLASS_TIME_LIMITS[cat] = {};
            }
            CLASS_TIME_LIMITS[cat][cls] = val;
            saveToFirebase();
            showToast('Tiempo actualizado', 'success');
            render();
        }

        function updatePilotScore(category, className, pilotId, dateIndex, value) {
            const data = APP_STATE.championship[category].data[className];
            const pilot = data.find(p => p.id === pilotId);
            if (pilot) {
                pilot.dates[dateIndex] = value === '' ? '' : parseInt(value) || 0;
                saveToFirebase();
                render(); 
            }
        }

        function addChampionshipDate(category) {
            const count = APP_STATE.championship[category].dates.length + 1;
            APP_STATE.championship[category].dates.push(`Fecha ${count}`);
            
            Object.values(APP_STATE.championship[category].data).forEach(classData => {
                classData.forEach(pilot => pilot.dates.push(''));
            });
            
            saveToFirebase();
            render();
            showToast(`Fecha ${count} añadida`, 'success');
        }

        function resetChampionshipYear(category) {
            if(confirm("ATENCIÓN: Esto borrará todos los puntos y dejará solo 1 fecha inicial. Los pilotos se mantendrán. ¿Estás seguro?")) {
                APP_STATE.championship[category].dates = ['Fecha 1'];
                Object.values(APP_STATE.championship[category].data).forEach(classData => {
                    classData.forEach(pilot => {
                        pilot.dates = [''];
                    });
                });
                saveToFirebase();
                render();
                showToast('Año reiniciado correctamente', 'info');
            }
        }

        function addCalendarEvent() {
            const dateVal = document.getElementById('newDate').value;
            const titleVal = document.getElementById('newDateTitle').value;
            
            if(!dateVal || !titleVal) {
                showToast('Completá la fecha y el título', 'error');
                return;
            }
            
            const formattedDate = dateVal.split('-').reverse().join('/');
            
            APP_STATE.calendar.push({
                id: Date.now(),
                title: titleVal,
                date: formattedDate,
                rawDate: dateVal,
                time: '',
                temp: '-',
                icon: 'fa-calendar text-blue-500',
                finished: false
            });

            if(!APP_STATE.userNotifications) APP_STATE.userNotifications = [];
            APP_STATE.userNotifications.push({
                id: Date.now() + 1,
                doc: 'all',
                type: 'system',
                title: '¡Nueva Fecha Confirmada!',
                message: `Se ha programado: ${titleVal} para el día ${formattedDate}. ¡Prepará tu máquina!`,
                date: new Date().toLocaleString([], {hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'2-digit'}),
                read: false
            });
            
            saveToFirebase();
            render();
            showToast('Fecha guardada exitosamente', 'success');
        }

        function deleteCalendarEvent(id) {
            if(confirm('¿Estás seguro de eliminar esta fecha del calendario?')) {
                APP_STATE.calendar = APP_STATE.calendar.filter(ev => ev.id !== id);
                saveToFirebase();
                render();
                showToast('Fecha eliminada', 'info');
            }
        }

        function replyToNotification(e, id, userDoc) {
            e.preventDefault();
            const input = document.getElementById(`reply-${id}`);
            const replyMessage = input.value;

            if(!APP_STATE.userNotifications) APP_STATE.userNotifications = [];
            
            APP_STATE.userNotifications.push({
                id: Date.now(),
                doc: userDoc,
                type: 'reply',
                title: 'Respuesta de Soporte',
                message: replyMessage,
                date: new Date().toLocaleString([], {hour: '2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'2-digit'}),
                read: false
            });

            APP_STATE.notifications = APP_STATE.notifications.filter(n => n.id !== id);

            saveToFirebase();
            render();
            showToast(`Respuesta enviada.`, 'success');
        }

        function deleteUserNotification(id) {
            APP_STATE.userNotifications = APP_STATE.userNotifications.filter(n => n.id !== id);
            saveToFirebase();
            render();
        }

        function deleteNotification(id) {
            if(confirm('¿Eliminar este mensaje sin responder?')) {
                APP_STATE.notifications = APP_STATE.notifications.filter(n => n.id !== id);
                saveToFirebase();
                render();
                showToast('Mensaje eliminado', 'info');
            }
        }

        function calculateGateTotal() {
            const isRacer = document.getElementById('gateIsRacer').checked;
            let total = 0;
            
            if (isRacer) {
                total = APP_STATE.prices.insurance;
            } else {
                const qty = parseInt(document.getElementById('gateQty').value) || 1;
                const parking = document.getElementById('gateParking').checked ? APP_STATE.prices.parking : 0;
                total = (qty * APP_STATE.prices.ticket) + parking;
            }
            
            document.getElementById('gateTotal').innerText = `$${total}`;
        }

        function toggleGateRacerMode() {
            const isRacer = document.getElementById('gateIsRacer').checked;
            const espSection = document.getElementById('espectadorSection');
            const racerSection = document.getElementById('racerSection');
            
            if(isRacer) {
                espSection.classList.add('hidden');
                racerSection.classList.remove('hidden');
            } else {
                espSection.classList.remove('hidden');
                racerSection.classList.add('hidden');
            }
            calculateGateTotal();
        }

        function processGatePayment() {
            const isRacer = document.getElementById('gateIsRacer').checked;
            let amount = 0;
            
            if (isRacer) {
                amount = APP_STATE.prices.insurance;
                APP_STATE.balance.insurance += amount;
            } else {
                const qty = parseInt(document.getElementById('gateQty').value) || 1;
                const parking = document.getElementById('gateParking').checked ? APP_STATE.prices.parking : 0;
                amount = (qty * APP_STATE.prices.ticket) + parking;
                APP_STATE.balance.spectators += amount;
            }
            
            const method = document.getElementById('gatePayment').value;
            const type = isRacer ? 'Piloto (Seguro)' : 'Espectador';
            
            saveToFirebase();
            showToast(`Cobro exitoso: ${type} - $${amount} en ${method}`, 'success');
            
            document.getElementById('gateQty').value = 1;
            document.getElementById('gateParking').checked = false;
            document.getElementById('gateIsRacer').checked = false;
            toggleGateRacerMode();
        }

        function updateTorreTotal() {
            const type = document.getElementById('torreType').value;
            const mode = document.querySelector('input[name="torreMode"]:checked').value;
            
            let total = 0;
            if (mode === 'reenganche') {
                total = APP_STATE.prices.reentry;
            } else {
                total = type === 'auto' ? APP_STATE.prices.autoEnrollment : APP_STATE.prices.motoEnrollment;
            }
            
            document.getElementById('torreTotal').innerText = `$${total}`;
        }

        function processTorrePayment() {
            const type = document.getElementById('torreType').value;
            const mode = document.querySelector('input[name="torreMode"]:checked').value;
            let amount = 0;
            
            if (mode === 'reenganche') {
                amount = APP_STATE.prices.reentry;
            } else {
                amount = type === 'auto' ? APP_STATE.prices.autoEnrollment : APP_STATE.prices.motoEnrollment;
            }
            
            if (type === 'auto') APP_STATE.balance.autoEnrollment += amount;
            if (type === 'moto') APP_STATE.balance.motoEnrollment += amount;

            const method = document.getElementById('torrePayment').value;
            saveToFirebase();
            showToast(`Inscripción registrada en torre: $${amount} en ${method}`, 'success');
        }

        function saveLivePrices(e) {
            e.preventDefault();
            APP_STATE.prices.ticket = parseInt(document.getElementById('valTicket').value);
            APP_STATE.prices.parking = parseInt(document.getElementById('valParking').value);
            APP_STATE.prices.insurance = parseInt(document.getElementById('valInsurance').value);
            APP_STATE.prices.autoEnrollment = parseInt(document.getElementById('valAuto').value);
            APP_STATE.prices.motoEnrollment = parseInt(document.getElementById('valMoto').value);
            APP_STATE.prices.reentry = parseInt(document.getElementById('valReentry').value);
            
            saveToFirebase();
            showToast('Valores actualizados correctamente.', 'success');
        }

        function startLiveEvent(category, cls) {
            APP_STATE.liveStatus = {
                active: true,
                category: category,
                class: cls
            };
            saveToFirebase();
            render();
            showToast(`¡Transmisión iniciada para ${cls}!`, 'success');
        }

        function stopLiveEvent() {
            APP_STATE.liveStatus.active = false;
            saveToFirebase();
            render();
            showToast('Evento en vivo detenido (Sin backup generado).', 'info');
        }

        function finishDate() {
            if(confirm("¿Estás seguro de finalizar la fecha? Esto guardará el balance actual en el historial y cerrará inscripciones.")) {
                const now = new Date();
                const snapshot = {
                    date: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    balance: { ...APP_STATE.balance },
                    total: APP_STATE.balance.spectators + APP_STATE.balance.insurance + APP_STATE.balance.autoEnrollment + APP_STATE.balance.motoEnrollment
                };
                
                APP_STATE.history.balances.push(snapshot);
                APP_STATE.balance = { spectators: 0, insurance: 0, autoEnrollment: 0, motoEnrollment: 0 };
                
                // Marcar el evento activo más cercano como finalizado para bloquear inscripciones
                let minDiff = Infinity;
                let eventToFinish = null;
                if (APP_STATE.calendar) {
                    APP_STATE.calendar.forEach(ev => {
                        if (ev.rawDate && !ev.finished) {
                            const evDate = new Date(ev.rawDate + 'T00:00:00');
                            const diff = evDate - now;
                            if (diff > -86400000 && diff < minDiff) { 
                                minDiff = diff;
                                eventToFinish = ev;
                            }
                        }
                    });
                }
                if (eventToFinish) eventToFinish.finished = true;

                saveToFirebase();
                APP_STATE.liveTab = 'fechas';
                render();
                showToast('Fecha finalizada y balance guardado con éxito.', 'success');
            }
        }

        function finishClass(category, cls) {
            if(confirm(`¿Estás seguro de finalizar la clase ${cls}? Esto guardará los resultados de esta fecha en el historial y detendrá la transmisión en vivo.`)) {
                const now = new Date();
                const dateIndex = APP_STATE.championship[category].dates.length - 1;
                const pilotsData = APP_STATE.championship[category].data[cls] || [];
                
                const backupPilots = pilotsData.map(p => ({
                    ins: p.ins,
                    pilot: p.pilot,
                    points: p.dates[dateIndex] || 0
                }));

                const snapshot = {
                    date: now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    category: category,
                    className: cls,
                    championshipDate: APP_STATE.championship[category].dates[dateIndex],
                    pilots: backupPilots
                };

                APP_STATE.history.classes.push(snapshot);
                APP_STATE.liveStatus.active = false;
                
                saveToFirebase();
                APP_STATE.liveTab = 'clases';
                render();
                showToast(`Clase ${cls} finalizada y guardada en el historial.`, 'success');
            }
        }

        // --- FETCH CLIMA ---
        async function fetchWeatherForConcordia(ev, elementId) {
            let rawDate = ev.rawDate;
            
            if (!rawDate && ev.date && ev.date.includes('/')) {
                const parts = ev.date.split('/');
                if (parts.length === 3) rawDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            if (!rawDate) return;

            try {
                const today = new Date();
                today.setHours(0,0,0,0);
                const targetDate = new Date(rawDate + 'T00:00:00'); 
                
                const diffTime = targetDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                const el = document.getElementById(elementId);
                if (!el) return;

                if (diffDays >= 0 && diffDays <= 14) {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=-31.3931&longitude=-58.0209&daily=weathercode,temperature_2m_max&timezone=America%2FArgentina%2FBuenos_Aires&start_date=${rawDate}&end_date=${rawDate}`;
                    
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    if (data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_max.length > 0) {
                        const temp = Math.round(data.daily.temperature_2m_max[0]) + '°C';
                        const code = data.daily.weathercode[0];
                        
                        let icon = 'fa-cloud text-gray-400';
                        if (code === 0) icon = 'fa-sun text-yellow-500';
                        else if (code <= 3) icon = 'fa-cloud-sun text-gray-300';
                        else if (code <= 48) icon = 'fa-smog text-gray-400';
                        else if (code <= 67) icon = 'fa-cloud-rain text-blue-400';
                        else if (code <= 77) icon = 'fa-snowflake text-white';
                        else if (code <= 82) icon = 'fa-cloud-showers-heavy text-blue-500';
                        else if (code >= 95) icon = 'fa-bolt text-yellow-400 text-[20px] drop-shadow-[0_0_8px_rgba(250,204,21,0.5)]';

                        el.innerHTML = `<i class="fas ${icon} text-2xl mb-1"></i><p class="text-xs font-bold text-gray-300">${temp}</p>`;
                        el.classList.add('fade-in');
                    }
                } else if (diffDays > 14) {
                     el.innerHTML = `<i class="fas fa-hourglass-half text-picadas-pink text-xl mb-1"></i><p class="text-[10px] font-bold text-gray-300 leading-tight text-center mt-1">Faltan<br>${diffDays} días</p>`;
                     el.classList.add('fade-in');
                } else if (diffDays < 0) {
                     el.innerHTML = `<i class="fas fa-flag-checkered text-gray-600 text-2xl mb-1"></i><p class="text-[9px] font-bold text-gray-500 uppercase mt-1">Finalizado</p>`;
                     el.classList.add('fade-in');
                }
            } catch (error) {
                console.log("Error consultando el clima:", error);
            }
        }

        // --- INIT APP ---
        function initApp() {
            loadFromFirebase();
            
            const session = localStorage.getItem('picadasSession');
            if(session) {
                APP_STATE.user = JSON.parse(session);
                setView('dashboard');
            } else {
                setView('login');
            }
        }

        window.onload = initApp;
    </script>
